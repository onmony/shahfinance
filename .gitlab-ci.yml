# GitLab Pages. `npm run build` emits dist/<route>/index.html plus dist/404.html,
# dist/sitemap.xml and dist/robots.txt, so Pages serves every route as a real document:
# /about redirects to /about/ and an unknown path gets 404.html with a genuine HTTP 404 (both
# per Pages documentation; confirm them on the first pipeline). No SPA fallback rewrite is needed.
stages: [deploy]

deploy-pages:
  stage: deploy
  image: node:24
  script:
    # vite.config.ts reads the asset prefix from CI_PAGES_URL, so nothing to export here.
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run build
    - npm run check:dist
    - npm run check:placeholders
  pages:
    publish: dist
  artifacts:
    when: always
    paths:
      - dist
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "feature_merge"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
